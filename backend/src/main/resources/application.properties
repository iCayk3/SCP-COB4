spring.application.name=cob4
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
server.error.include-stacktrace=never
api.service.integration.rbx=${RBX_API_URL:}
api.service.integration.rbx.v2=${RBX_API_V2_URL:}
api.service.integration.rbx.chave=${RBX_API_KEY:}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
sgc.cobranca.responsavel-padrao.nome=${SGC_RESPONSAVEL_PADRAO_NOME:Fila de Cobrança}
sgc.cobranca.responsavel-padrao.identificador=${SGC_RESPONSAVEL_PADRAO_ID:FILA_COBRANCA}
sgc.cobranca.sla-padrao-horas=${SGC_SLA_PADRAO_HORAS:24}
sgc.cobranca.sla-verificacao-ms=${SGC_SLA_VERIFICACAO_MS:60000}
sgc.cobranca.sla-verificacao-inicial-ms=${SGC_SLA_VERIFICACAO_INICIAL_MS:60000}
sgc.cobranca.primeiro-contato-minutos=${SGC_PRIMEIRO_CONTATO_MINUTOS:30}
sgc.cobranca.ligacao-sem-resposta-dias=${SGC_LIGACAO_SEM_RESPOSTA_DIAS:7}
sgc.demo.dados-ficticios=${SGC_DEMO_DADOS_FICTICIOS:true}
