spring.application.name=cob4
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
api.service.integration.rbx=${RBX_API_URL:}
api.service.integration.rbx.v2=${RBX_API_V2_URL:}
api.service.integration.rbx.chave=${RBX_API_KEY:}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
sgc.security.jwt.secret=${SGC_JWT_SECRET:troque-esta-chave-jwt-em-producao-32-caracteres}
sgc.security.jwt.expiracao-segundos=${SGC_JWT_EXPIRACAO_SEGUNDOS:1800}
sgc.security.usuario-inicial.senha=${SGC_USUARIO_INICIAL_SENHA:Alterar@123}
sgc.security.login.max-falhas=${SGC_LOGIN_MAX_FALHAS:5}
sgc.security.login.bloqueio-minutos=${SGC_LOGIN_BLOQUEIO_MINUTOS:15}
sgc.security.cors.origens=${SGC_CORS_ORIGENS:http://localhost:5173}
sgc.security.cookie.secure=${SGC_COOKIE_SECURE:false}
sgc.cobranca.responsavel-padrao.nome=${SGC_RESPONSAVEL_PADRAO_NOME:Fila de Cobrança}
sgc.cobranca.responsavel-padrao.identificador=${SGC_RESPONSAVEL_PADRAO_ID:FILA_COBRANCA}
sgc.cobranca.sla-padrao-horas=${SGC_SLA_PADRAO_HORAS:24}
sgc.cobranca.sla-verificacao-ms=${SGC_SLA_VERIFICACAO_MS:60000}
sgc.cobranca.sla-verificacao-inicial-ms=${SGC_SLA_VERIFICACAO_INICIAL_MS:60000}
sgc.cobranca.sla.zona=${SGC_SLA_ZONA:America/Sao_Paulo}
sgc.cobranca.sla.jornada-inicio=${SGC_SLA_JORNADA_INICIO:08:00}
sgc.cobranca.sla.jornada-fim=${SGC_SLA_JORNADA_FIM:18:00}
sgc.cobranca.sla.feriados=${SGC_SLA_FERIADOS:}
sgc.cobranca.sla.escalonamento-horas=${SGC_SLA_ESCALONAMENTO_HORAS:0,4,8}
sgc.cobranca.sla.notificacao.remetente=${SGC_SLA_EMAIL_REMETENTE:noreply@localhost}
sgc.cobranca.sla.notificacao.destinatarios=${SGC_SLA_EMAIL_DESTINATARIOS:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
sgc.cobranca.primeiro-contato-minutos=${SGC_PRIMEIRO_CONTATO_MINUTOS:30}
sgc.cobranca.ligacao-sem-resposta-dias=${SGC_LIGACAO_SEM_RESPOSTA_DIAS:7}
sgc.demo.dados-ficticios=${SGC_DEMO_DADOS_FICTICIOS:true}
sgc.rbx.retry.max-tentativas=${SGC_RBX_RETRY_MAX_TENTATIVAS:3}
sgc.rbx.retry.backoff-inicial-ms=${SGC_RBX_RETRY_BACKOFF_INICIAL_MS:250}
sgc.rbx.retry.backoff-max-ms=${SGC_RBX_RETRY_BACKOFF_MAX_MS:300000}
sgc.rbx.fila.max-tentativas=${SGC_RBX_FILA_MAX_TENTATIVAS:8}
sgc.rbx.fila.backoff-inicial-ms=${SGC_RBX_FILA_BACKOFF_INICIAL_MS:60000}
sgc.rbx.fila.verificacao-ms=${SGC_RBX_FILA_VERIFICACAO_MS:30000}
sgc.rbx.fila.verificacao-inicial-ms=${SGC_RBX_FILA_VERIFICACAO_INICIAL_MS:30000}
sgc.rbx.fila.lease-ms=${SGC_RBX_FILA_LEASE_MS:900000}
